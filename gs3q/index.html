<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>ExpGame</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      #game-canvas { display: block; width: 100%; height: 100%; background: #000; outline: none; }
      #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 240px; height: 4px;
                 background: #2a2e33; border-radius: 2px; overflow: hidden; }
      #loading-bar { width: 0; height: 100%; background: #d9dde2; }
      #message { position: fixed; left: 0; right: 0; top: 0; display: none; padding: 12px 16px;
                 font: 15px/1.4 sans-serif; color: #000; }
    </style>
  </head>
  <body>
    <canvas id="game-canvas" tabindex="-1"></canvas>
    <div id="loading"><div id="loading-bar"></div></div>
    <div id="message"></div>
    <script>
      var canvas = document.querySelector("#game-canvas");

      function showMessage(text, type) {
        var box = document.querySelector("#message");
        box.textContent = text;
        box.style.background = type == "error" ? "#e05555" : "#e8c547";
        box.style.display = "block";
        if (type != "error") setTimeout(function () { box.style.display = "none"; }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL_tune_2026-11-15_1208.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL_tune_2026-11-15_1208.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL_tune_2026-11-15_1208.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "ExpGame",
        productVersion: "1.0",
        showBanner: showMessage,
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/WebGL_tune_2026-11-15_1208.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#loading-bar").style.width = 100 * progress + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          showMessage(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
